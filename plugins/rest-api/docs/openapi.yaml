              type: object
              properties:
                total:
                  type: integer
                completed:
                  type: integer
            campaigns:
              type: object
              properties:
                total:
                  type: integer
                running:
                  type: integer
                completed:
                  type: integer
        meta:
          $ref: '#/components/schemas/Meta'

    CreateWebhookRequest:
      type: object
      required:
        - url
        - events
      properties:
        url:
          type: string
          format: uri
          description: HTTPS endpoint to receive webhook payloads
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - call.started
              - call.ringing
              - call.answered
              - call.completed
              - call.failed
              - call.transferred
              - call.no_answer
              - call.busy
              - call.voicemail
              - inbound_call.received
              - inbound_call.answered
              - inbound_call.completed
              - inbound_call.missed
              - campaign.started
              - campaign.paused
              - campaign.resumed
              - campaign.completed
              - campaign.failed
              - campaign.cancelled
              - appointment.booked
              - appointment.confirmed
              - appointment.cancelled
              - appointment.rescheduled
              - appointment.completed
              - appointment.no_show
              - callback.scheduled
              - lead.upserted
              - form.submitted
              - form.lead_created
              - flow.started
              - flow.completed
              - flow.failed
        secret:
          type: string
          minLength: 16
          maxLength: 64
          description: Custom signing secret, 16–64 characters (auto-generated if not provided)
        name:
          type: string
          maxLength: 255
        description:
          type: string

    UpdateWebhookRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        isActive:
          type: boolean
        description:
          type: string

    Webhook:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        url:
          type: string
        events:
          type: array
          items:
            type: string
        isActive:
          type: boolean
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    WebhookResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          allOf:
            - $ref: '#/components/schemas/Webhook'
            - type: object
              properties:
                secret:
                  type: string
                  description: Only returned on creation
        meta:
          $ref: '#/components/schemas/Meta'

    WebhookListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'
        meta:
          $ref: '#/components/schemas/Meta'

    WebhookEventsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            events:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  description:
                    type: string
        meta:
          $ref: '#/components/schemas/Meta'

    WebhookTestResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            delivered:
              type: boolean
            statusCode:
              type: integer
            message:
              type: string
        meta:
          $ref: '#/components/schemas/Meta'

    # ---------------------------------------------------------------- Call outcomes
    CallOutcome:
      type: string
      description: How the call went. Agent-kind outcomes are set in conversation or via the API; system-kind by the platform.
      enum: [interested, not_interested, callback_requested, wrong_number, already_customer, do_not_call, no_decision, voicemail, no_answer, busy, failed, transferred, appointment_booked]

    CallOutcomesResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
            properties:
              id:
                $ref: '#/components/schemas/CallOutcome'
              label:
                type: string
              kind:
                type: string
                enum: [agent, system]
        meta:
          $ref: '#/components/schemas/Meta'

    SetCallOutcomeRequest:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [interested, not_interested, callback_requested, wrong_number, already_customer, do_not_call, no_decision]
        note:
          type: string
          maxLength: 500

    SetCallOutcomeResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            callId:
              type: string
            outcome:
              type: string
            outcomeSource:
              type: string
              example: agent
            note:
              type: string
              nullable: true
        meta:
          $ref: '#/components/schemas/Meta'

    ScheduledCallResponse:
      type: object
      description: Returned with HTTP 202 when `POST /calls` carries a future `scheduledAt`
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            scheduled:
              type: boolean
              example: true
            callbackId:
              type: string
              format: uuid
            scheduledAt:
              type: string
              format: date-time
        meta:
          $ref: '#/components/schemas/Meta'

    AgentActionsSummary:
      type: object
      description: Which call actions the agent has enabled (API tool headers are never exposed)
      properties:
        transfer:
          type: boolean
        appointments:
          type: boolean
        saveLead:
          type: boolean
        callbacks:
          type: boolean
        apiTools:
          type: integer
          description: Number of custom API lookup tools
        voicemail:
          type: string
          nullable: true
          enum: [hangup, leave_message, null]
        ownerAlerts:
          type: boolean

    # ---------------------------------------------------------------- Do-not-call
    DoNotCallEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
          example: "+919876543210"
        reason:
          type: string
          enum: [caller_request, manual, import, complaint]
        source:
          type: string
          enum: [agent, manual, upload, api]
        note:
          type: string
          nullable: true
        callId:
          type: string
          nullable: true
          description: Call during which the agent added the number
        createdAt:
          type: string
          format: date-time

    DoNotCallListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/DoNotCallEntry'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    DoNotCallCheckResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            phone:
              type: string
              description: Normalised number
            blocked:
              type: boolean
        meta:
          $ref: '#/components/schemas/Meta'

    AddDoNotCallRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: E.164 or 10-digit Indian number
          example: "+919876543210"
        reason:
          type: string
          enum: [manual, complaint]
          default: manual
        note:
          type: string
          maxLength: 500

    AddDoNotCallResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            phone:
              type: string
            added:
              type: boolean
              description: false when the number was already blocked
        meta:
          $ref: '#/components/schemas/Meta'

    ImportDoNotCallRequest:
      type: object
      required: [phones]
      properties:
        phones:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            type: string

    ImportDoNotCallResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            added:
              type: integer
            skipped:
              type: integer
              description: Invalid or already-blocked numbers
        meta:
          $ref: '#/components/schemas/Meta'

    RemovedResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            removed:
              type: boolean
              example: true
        meta:
          $ref: '#/components/schemas/Meta'

    # ---------------------------------------------------------------- Callbacks
    CallbackVariables:
      type: object
      description: Up to 20 keys; values up to 300 characters. Available to the agent as `{{key}}`.
      maxProperties: 20
      additionalProperties:
        type: string
        maxLength: 300
      example: { first_name: "Priya", webinar_title: "GST filing for startups" }

    Callback:
      type: object
      properties:
        id:
          type: string
          format: uuid
        contactName:
          type: string
          nullable: true
        contactPhone:
          type: string
          example: "+919876543210"
        reason:
          type: string
          nullable: true
        scheduledAt:
          type: string
          format: date-time
        timeZone:
          type: string
          example: Asia/Kolkata
        status:
          type: string
          enum: [pending, calling, completed, failed, cancelled]
        attempts:
          type: integer
        lastError:
          type: string
          nullable: true
        agentId:
          type: string
          format: uuid
          nullable: true
        agentName:
          type: string
          nullable: true
        resultCallId:
          type: string
          nullable: true
          description: The call placed for this callback — use it with `GET /calls/{id}`
        variables:
          $ref: '#/components/schemas/CallbackVariables'
        externalRef:
          type: string
          nullable: true
          maxLength: 120
        source:
          type: string
          enum: [agent, manual, api]
        createdAt:
          type: string
          format: date-time

    CallbackResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Callback'
        meta:
          $ref: '#/components/schemas/Meta'

    CallbackCancelResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            cancelled:
              type: boolean
              example: true
            callback:
              $ref: '#/components/schemas/Callback'
        meta:
          $ref: '#/components/schemas/Meta'

    CallbackListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Callback'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    CreateCallbackRequest:
      type: object
      required: [agentId, contactPhone, scheduledAt]
      properties:
        agentId:
          type: string
          format: uuid
        contactPhone:
          type: string
          example: "+919876543210"
        scheduledAt:
          type: string
          format: date-time
          description: In the future, at most 60 days ahead. Include the offset (e.g. `+05:30`) or send UTC.
          example: "2026-09-29T11:00:00+05:30"
        contactName:
          type: string
        reason:
          type: string
          maxLength: 200
          description: Told to the agent so it knows what the call is about
        timeZone:
          type: string
          description: IANA zone shown in the dashboard
          default: Asia/Kolkata
        variables:
          $ref: '#/components/schemas/CallbackVariables'
        externalRef:
          type: string
          maxLength: 120
          description: Idempotency key — same ref returns the existing callback (HTTP 200)

    BulkCallbackRequest:
      type: object
      required: [agentId, contacts]
      properties:
        agentId:
          type: string
          format: uuid
        timeZone:
          type: string
          default: Asia/Kolkata
        contacts:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [phone, scheduledAt]
            properties:
              phone:
                type: string
              name:
                type: string
              scheduledAt:
                type: string
                format: date-time
              reason:
                type: string
                maxLength: 200
              variables:
                $ref: '#/components/schemas/CallbackVariables'
              externalRef:
                type: string
                maxLength: 120

    BulkCallbackResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            created:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  phone:
                    type: string
                  externalRef:
                    type: string
                    nullable: true
                  scheduledAt:
                    type: string
                    format: date-time
            skipped:
              type: array
              items:
                type: object
                properties:
                  phone:
                    type: string
                  externalRef:
                    type: string
                    nullable: true
                  reason:
                    type: string
                    enum: [do_not_call, duplicate, invalid_phone, past, too_far]
        meta:
          $ref: '#/components/schemas/Meta'

    # ---------------------------------------------------------------- Leads
    Lead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sourceType:
          type: string
          enum: [campaign, incoming]
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        phone:
          type: string
        email:
          type: string
          nullable: true
        company:
          type: string
          nullable: true
        stage:
          type: string
          description: Pipeline stage key (default pipeline — new, hot, appointment, form_submitted, follow_up, not_interested, no_answer)
        leadScore:
          type: integer
          nullable: true
          description: 1–100, AI-generated
        aiCategory:
          type: string
          nullable: true
          enum: [warm, hot, appointment_booked, form_submitted, call_transfer, need_follow_up, null]
        aiSummary:
          type: string
          nullable: true
        aiNextAction:
          type: string
          nullable: true
        sentiment:
          type: string
          nullable: true
          enum: [positive, neutral, negative, null]
        hasAppointment:
          type: boolean
        hasCallback:
          type: boolean
        tags:
          type: array
          items:
            type: string
        customFields:
          type: object
          additionalProperties: true
        assignedUserId:
          type: string
          nullable: true
        totalCalls:
          type: integer
        lastCallAt:
          type: string
          format: date-time
          nullable: true
        callId:
          type: string
          nullable: true
          description: The call that created the lead
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LeadNote:
      type: object
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
        createdAt:
          type: string
          format: date-time

    LeadResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Lead'
        meta:
          $ref: '#/components/schemas/Meta'

    LeadDetailResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          allOf:
            - $ref: '#/components/schemas/Lead'
            - type: object
              properties:
                notes:
                  type: array
                  items:
                    $ref: '#/components/schemas/LeadNote'
        meta:
          $ref: '#/components/schemas/Meta'

    LeadListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Lead'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    UpdateLeadRequest:
      type: object
      properties:
        stage:
          type: string
          description: One of your pipeline stage keys
        tags:
          type: array
          items:
            type: string
        customFields:
          type: object
          additionalProperties: true
          description: Shallow-merged into the existing custom fields
        assignedUserId:
          type: string
          nullable: true
          description: Team member id, or null to unassign
        email:
          type: string
        company:
          type: string

    CreateLeadNoteRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 4000

    LeadNoteResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/LeadNote'
        meta:
          $ref: '#/components/schemas/Meta'

    # ---------------------------------------------------------------- Appointments
    Appointment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        contactName:
          type: string
        contactPhone:
          type: string
        contactEmail:
          type: string
          nullable: true
        appointmentDate:
          type: string
          format: date
          example: "2026-09-30"
        appointmentTime:
          type: string
          description: Local time (HH:MM:SS) in the agent's appointment time zone
          example: "11:00:00"
        duration:
          type: integer
          description: Minutes
        serviceName:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        status:
          type: string
          enum: [scheduled, confirmed, cancelled, completed, no_show]
        statusReason:
          type: string
          nullable: true
        callId:
          type: string
          nullable: true
        googleCalendarEventId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AppointmentResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Appointment'
        meta:
          $ref: '#/components/schemas/Meta'

    AppointmentListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Appointment'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    UpdateAppointmentRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [scheduled, confirmed, cancelled, completed, no_show]
        statusReason:
          type: string
          maxLength: 500
