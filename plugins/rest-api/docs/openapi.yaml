  /agents/{id}/flow:
    get:
      summary: Export Agent Flow
      description: |
        Export the visual conversation flow for a Flow-type agent. Returns the complete flow structure including nodes, edges, and variables.
        
        <br />
        
        **Use Cases:**
        - Backup agent configurations
        - Clone flows to other agents
        - Version control flow designs
        - Share flows between accounts
        
        <br />
        
        **Note:** Only works for agents with `type: flow`. Incoming agents don't have exportable flows.
        
        <br />
        
        **Required Scope:** `agents:read`
      operationId: exportAgentFlow
      tags: [Agents]
      parameters:
