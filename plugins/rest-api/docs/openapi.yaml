  /contacts/{id}:
    get:
      summary: Get Contact Details
      description: |
        Retrieve complete information about a contact including call history and AI enrichment.
        
        <br />
        
        **AI Enrichment (after calls):**
        - `aiSummary` — AI-generated summary of conversations
        - `sentiment` — Detected sentiment (positive, neutral, negative)
        - `leadScore` — Automatically calculated lead score
        
        <br />
        
        **Required Scope:** `contacts:read`
      operationId: getContact
      tags: [Contacts]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Complete contact details with AI enrichment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update Contact
      description: |
        Update contact information. Only include fields you want to change.
        
        <br />
        
        **Tip:** Update the `stage` field to move contacts through your sales funnel.
        
        <br />
        
        **Required Scope:** `contacts:write`
      operationId: updateContact
      tags: [Contacts]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContactRequest'
      responses:
        '200':
          description: Contact updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete Contact
      description: |
        Permanently delete a contact and all associated data.
        
        <br />
        
        **Warning:** This action cannot be undone. Call history remains but will no longer be linked to this contact.
        
        <br />
        
        **Required Scope:** `contacts:write`
      operationId: deleteContact
      tags: [Contacts]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Contact permanently deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /contacts/bulk-import:
    post:
      summary: Bulk Import Contacts
      description: |
        Import up to 10,000 contacts in a single request. Ideal for syncing from external CRMs or uploading lists.
        
        <br />
        
        **Behavior:**
        - Duplicate phone numbers are skipped
        - Invalid records are counted in `failed` response field
        - Import is atomic — all succeed or detailed errors returned
        
        <br />
        
        **Performance Tip:** For very large imports, batch into multiple requests of 5,000 contacts each.
        
        <br />
        
        **Required Scope:** `contacts:write`
      operationId: bulkImportContacts
      tags: [Contacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkImportRequest'
      responses:
        '201':
          description: Import completed with success/failure counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkImportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /credits/balance:
    get:
      summary: Get Credit Balance
      description: |
        Check your current credit balance. Use this to verify you have sufficient credits before starting campaigns.
        
        <br />
        
        **Credit System:**
        - 1 credit = 1 minute of call time
        - Partial minutes are rounded up
        - Balance updates in real-time during calls
        
        <br />
        
        **Required Scope:** `credits:read`
      operationId: getCreditBalance
      tags: [Credits]
      responses:
        '200':
          description: Current credit balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditBalanceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /credits/usage:
    get:
      summary: Get Credit Usage
      description: |
        Retrieve credit usage history for budgeting and analysis. Shows daily usage breakdown.
        
        <br />
        
        **Use Cases:**
        - Track spending over time
        - Identify high-usage periods
        - Plan credit purchases
        - Generate billing reports
        
        <br />
        
        **Required Scope:** `credits:read`
      operationId: getCreditUsage
      tags: [Credits]
