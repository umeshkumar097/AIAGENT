        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Import Agent Flow
      description: |
        Replace an agent's conversation flow with an imported definition. Use this to restore backups or deploy flows from templates.
        
        <br />
        
        **Warning:** This replaces the existing flow entirely. Export the current flow first if you want to preserve it.
        
        <br />
        
        **Flow Structure:**
        - `nodes` — Array of flow nodes (message, question, condition, etc.)
        - `edges` — Connections between nodes
        - `variables` — Flow variables for data collection
        
