              failed:
                type: integer
              pending:
                type: integer
              successRate:
                type: integer
              startedAt:
                type: string
                format: date-time
              completedAt:
                type: string
                format: date-time
        meta:
          $ref: '#/components/schemas/Meta'

    AnalyticsSummaryResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            period:
              type: object
              properties:
                start:
                  type: string
                  format: date-time
                end:
                  type: string
